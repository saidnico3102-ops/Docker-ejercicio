services:
  api:
    build: ./api
    ports:
      - "${PORT}:3000"
    environment:
      MESSAGE: ${MESSAGE}
      PORT: 3000

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: