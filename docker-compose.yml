services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      MESSAGE: Said Miñan
      PORT: 3000

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab02_user
      POSTGRES_PASSWORD: lab02_pass
      POSTGRES_DB: lab02_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: